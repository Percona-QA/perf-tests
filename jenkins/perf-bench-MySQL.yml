- job-template:
    name: perf-bench-{name}
    node: '{node}'  # restricted to specific node
    description: |
        Performance regression testing for MySQL/Percona Server<BR><BR>
        <b>Do not make changes to the pipeline definition via the web interface!<br>
        (Do not use 'Configure' option on the left for changing the pipeline definition)<br></b>
        Change <a href="https://github.com/Percona-QA/perf-tests/blob/3.1/jenkins/perf-bench-MySQL.yml">perf-bench-MySQL.yml</a> instead.</b><br>
        Then update pipeline with "jenkins-jobs --server ps80.cd update jenkins/perf-bench-MySQL.yml".
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 16
        artifact-days-to-keep: -1
        artifact-num-to-keep: 16
    parameters:
    - string:
        name: RUN_NAME
        description: "The additional field for results cache to force results to be distinguished in a separate bucket (please don't use 'nightly')"
        default: "{run_name}"
        trim: false
    - string:
        name: SERVER_REPO_URL
        description: "https://github.com/percona/percona-server<BR>https://github.com/mysql/mysql-server"
        default: "https://github.com/percona/percona-server"   
        trim: false
    - string:
        name: SERVER_BRANCH
        description: "mysql-8.0.42 mysql-8.0.43 mysql-8.0.44 mysql-8.0.45<BR>release-8.0.42-33 release-8.0.43-34 release-8.0.44-35 release-8.0.45-36<BR>mysql-8.4.4 mysql-8.4.5 mysql-8.4.6 mysql-8.4.7<BR>release-8.4.5-5 release-8.4.6-6 release-8.4.7-7 release-8.4.8-8<BR>mysql-9.3.0 mysql-9.4.0 mysql-9.5.0 mysql-9.6.0<BR>release-9.3.0-1 release-9.4.0-1 release-9.5.0-1 release-9.6.0-1<BR>"
        default: "release-8.4.8-8"
        trim: false
    - string:
        name: WORKLOAD_NAMES
        description: "Workload names separated by comma from <a href=\"https://github.com/Percona-QA/perf-tests/blob/3.1/db_bench/workloads.inc\">https://github.com/Percona-QA/perf-tests/blob/3.1/db_bench/workloads.inc</a><BR><b>reads</b> takes about 4h = POINT_SELECT,SELECT_RANDOM_POINTS,SELECT_HOT_POINTS,POINTS_COVERED,POINTS_COVERED_SI,POINTS_NOTCOVERED,POINTS_NOTCOVERED_SI, RANGE_COVERED,RANGE_COVERED_SI,RANGE_NOTCOVERED,RANGE_NOTCOVERED_SI,SIMPLE_RANGES,SUM_RANGES,ORDER_RANGES,DISTINCT_RANGES,COUNT_RANGES<BR><b>writes</b> takes about 4h = WR_INLIST_UPDATE,WR_INLIST_UPDATE_HOT_POINTS,WR_UPDATE_INDEX,WR_UPDATE_INDEX_LIMIT,WR_UPDATE_NON_INDEX,WR_DELETE_INSERTS, WR_DELETE,WR_INSERT,WR_REPLACE"
        default: "reads,writes"
        #default: "heavy_trx"
        trim: false
    - string:
        name: CNFFILE_NAME
        description: "MySQL config file from <a href=\"https://github.com/Percona-QA/perf-tests/tree/3.1/cnf\">https://github.com/Percona-QA/perf-tests/tree/3.1/cnf</a><BR><b>innodb-57.cnf</b> for Percona Server 5.7 and newer<BR><b>innodb-80.cnf</b> for Percona Server 8.0 and newer<BR><b>innodb-84.cnf</b> for Percona Server 8.4 and newer<BR>All config files are ACID compliant; use <b>EXTRA_CONFIG_FILES=extra-no-ACID.cnf</b> to disable ACID and improve performance + stability"
        default: "{config_file}"
        trim: false
    - string:
        name: EXTRA_CONFIG_FILES
        description: "Space-separated list of extra config files (relative to db-bench repo). Concatenated and passed as <b>--defaults-extra-file</b>.<BR>Available files: <a href=\"https://github.com/Percona-QA/perf-tests/tree/3.1/cnf\">cnf/extra-*.cnf</a><BR><b>extra-no-ACID.cnf</b> - disables ACID (sync_binlog=1024, innodb_flush_log_at_trx_commit=0) for more stable results and better performance<BR><b>extra-nproc{{16,32,64,128}}.cnf</b> - fixes InnoDB thread settings (buffer_pool_instances, page_cleaners, read_io_threads, parallel_read_threads) for a given CPU count; use on MySQL/PS 8.4+ where these auto-scale with nproc"
        default: "cnf/extra-no-ACID.cnf cnf/extra-nproc16.cnf"
        trim: false
    - string:
        name: MYEXTRA
        description: "Extra params for MySQL"
        trim: false
    - string:
        name: CXXFLAGS
        description: "Additional flags used during compilation"
        default: "{compiler_flags}"
        trim: false
    - string:
        name: RESULTS_EMAIL
        description: "List of e-mails separated by commas"
        default: "przemyslaw.skibinski@percona.com"
        trim: false
    - string:
        name: THREADS_LIST
        default: "8 16 32 64"
        trim: false
    - string:
        name: WRITES_TIME_SECONDS
        description: "WRITES_TIME_SECONDS will be spent for writes only. Only half of given time will be spent for reads."
        default: "300"
        trim: false
    - string:
        name: NUM_TABLES
        default: "16"
        trim: false
    - string:
        name: DATASIZE
        default: "10M"
        trim: false
    - string:
        name: ENGINE_CACHE
        default: "96G"
        trim: false
    - string:
        name: ENGINE
        default: "{engine}"
        description: only "innodb" and "rocksdb" are supported
    - string:
        name: SELECTED_CC
        default: "{cc_compiler}"
        trim: false
    - string:
        name: SELECTED_CXX
        default: "{cxx_compiler}"
        trim: false
    - string:
        name: SCALING_GOVERNOR
        description: "Available cpufreq governors: conservative ondemand userspace powersave performance schedutil"
        default: "performance"
        trim: false
    - string:
        name: REPEAT_NUM
        description: "How many times to repeat perf benchmarking"
        default: "1"
        trim: false
    - choice:
        name: REBUILD_TEMPLATE
        choices:
        - "OFF"
        - "ON"
    - choice:
        name: DBBENCH_SSL
        choices:
        - "off"
        - "on"
    - choice:
        name: WITH_PGO
        description: "Build MySQL/Percona Server with PGO (profile guided optimization).<BR>It is a 3-pass build: instrumented build, training with <b>make run-profile-suite</b> (mysql-test-run), then the final build with <b>-DFPROFILE_USE=1</b> (which also enables LTO).<BR>ccache is disabled and the build takes about 3x longer."
        choices:
        - "off"
        - "on"
    - choice:
        name: ROOT_DIR
        description: "Path to directory where benchmarks are run (depends on the specific machine)"
        choices: "{root_dir}"
    - choice:
        name: DATA_DIR
        choices:
        - ""
        - "/dev/shm"
    - string:
        name: SYSBENCH_HOST
        description: "Switch sysbench to connect using TCP/IP connection to $SYSBENCH_HOST"
        trim: false
    can_roam: false
    disabled: false
    block_build_when_downstream_building: false
    block_build_when_upstream_building: false
    triggers: []
    concurrent_build: false
    builders:
      - shell:
          command: |
            uname -a
            df -h
            ls -la
            rm -rf *
            ls -la

            export BACKUP_DIR=$WORKSPACE
            unset WORKSPACE

            echo "User: $(whoami) USER=$USER"
            echo SERVER_REPO_URL=$SERVER_REPO_URL
            echo SERVER_BRANCH=$SERVER_BRANCH
            echo MYEXTRA=$MYEXTRA
            echo CXXFLAGS=$CXXFLAGS
            echo WORKLOAD_NAMES=$WORKLOAD_NAMES
            echo CNFFILE_NAME=$CNFFILE_NAME
            echo EXTRA_CONFIG_FILES=$EXTRA_CONFIG_FILES
            echo RESULTS_EMAIL=$RESULTS_EMAIL
            echo THREADS_LIST=$THREADS_LIST
            echo WRITES_TIME_SECONDS=$WRITES_TIME_SECONDS
            echo NUM_TABLES=$NUM_TABLES
            echo DATASIZE=$DATASIZE
            echo ENGINE_CACHE=$ENGINE_CACHE
            echo SELECTED_CC=$SELECTED_CC
            echo SELECTED_CXX=$SELECTED_CXX
            echo SCALING_GOVERNOR=$SCALING_GOVERNOR
            echo REPEAT_NUM=$REPEAT_NUM
            echo REBUILD_TEMPLATE=$REBUILD_TEMPLATE
            echo RUN_NAME=$RUN_NAME
            echo DATA_DIR=$DATA_DIR
            echo ROOT_DIR=$ROOT_DIR
            echo DBBENCH_SSL=$DBBENCH_SSL
            echo WITH_PGO=$WITH_PGO

            #export DB_USER=$USER
            export TEMPLATE_PATH={template_path}
            export CACHE_DIR=$ROOT_DIR/results_cache

            sudo mkdir -p $ROOT_DIR
            sudo chown $USER:$USER $ROOT_DIR
            cd $ROOT_DIR
            rm -f build-and-bench.sh
            wget https://raw.githubusercontent.com/Percona-QA/perf-tests/refs/heads/3.1/build-and-bench.sh
            chmod a+x build-and-bench.sh
            sudo -E nice --adjustment=-10 sudo -E -u jenkins bash -xe ./build-and-bench.sh

    publishers:
      - archive:
          artifacts: "*.tar.gz, *.csv, *.html"
          allow_empty_archive: false
          only_if_successful: false
          fingerprint: false
          default_excludes: true
          case_sensitive: true
          follow_symlinks: false
    build_wrappers: []

- project:
    name: InnoDB-smblade04
    node: sm-blade04
    engine: innodb
    template_path: /mnt/data/template_datadir
    root_dir:
      - /mnt/fast/bench-innodb
      - /mnt/data/bench-innodb
    run_name: node04-innodb
    config_file: cnf/innodb-84.cnf
    cc_compiler: gcc-13
    cxx_compiler: g++-13
    compiler_flags: -march=westmere
    jobs:
      - perf-bench-{name}

- project:
    name: RocksDB-smblade04
    node: sm-blade04
    engine: rocksdb
    template_path: /mnt/data/template_datadir
    root_dir:
      - /mnt/fast/bench-rocksdb
      - /mnt/data/bench-rocksdb
    run_name: node04-myrocks
    config_file: cnf/rocksdb.cnf
    cc_compiler: gcc-13
    cxx_compiler: g++-13
    compiler_flags: -march=westmere
    jobs:
      - perf-bench-{name}


name: MySQL Perf Bench Gemini 3.0 Pro

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Configuration Preset (Pre-fills other values if not Custom)'
        type: choice
        options:
          - Custom
          - InnoDB-smblade04
          - InnoDB-epyc9654
          - RocksDB-smblade04
          - RocksDB-epyc9654
        default: 'Custom'
      runner_label:
        description: 'Runner Label (e.g., self-hosted, sm-blade04)'
        type: string
        default: 'self-hosted'
      run_name:
        description: 'Run Name (suffix for results)'
        type: string
        default: ''
      server_repo_url:
        description: 'Server Repo URL'
        type: string
        default: 'https://github.com/percona/percona-server'
      server_branch:
        description: 'Server Branch'
        type: string
        default: 'release-8.4.7-7'
      workload_names:
        description: 'Workload Names'
        type: string
        default: 'prod_trx'
      cnffile_name:
        description: 'Config File Name'
        type: string
        default: ''
      myextra:
        description: 'Extra MySQL Params'
        type: string
        default: ''
      cxxflags:
        description: 'CXXFLAGS'
        type: string
        default: ''
      results_email:
        description: 'Results Email'
        type: string
        default: 'przemyslaw.skibinski@percona.com'
      threads_list:
        description: 'Threads List'
        type: string
        default: '8 16 32 64'
      writes_time_seconds:
        description: 'Writes Time Seconds'
        type: string
        default: '300'
      num_tables:
        description: 'Num Tables'
        type: string
        default: '16'
      datasize:
        description: 'Datasize'
        type: string
        default: '10M'
      engine_cache:
        description: 'Engine Cache'
        type: string
        default: '96G'
      engine:
        description: 'Engine (innodb/rocksdb)'
        type: string
        default: 'innodb'
      selected_cc:
        description: 'Selected CC'
        type: string
        default: ''
      selected_cxx:
        description: 'Selected CXX'
        type: string
        default: ''
      scaling_governor:
        description: 'Scaling Governor'
        type: string
        default: 'performance'
      repeat_num:
        description: 'Repeat Num'
        type: string
        default: '1'
      rebuild_template:
        description: 'Rebuild Template'
        type: choice
        options:
          - 'OFF'
          - 'ON'
        default: 'OFF'
      dbbench_ssl:
        description: 'DBBench SSL'
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'off'
      root_dir:
        description: 'Root Dir (Benchmarks run here)'
        type: string
        default: ''
      data_dir:
        description: 'Data Dir (e.g. /dev/shm)'
        type: string
        default: ''
      #sysbench_host:
      #  description: 'Sysbench Host'
      #  type: string
      #  default: ''
      template_path:
        description: 'Template Path (for presets)'
        type: string
        default: ''

jobs:
  perf-bench:
    runs-on: ${{ github.event.inputs.runner_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Environment
        id: config
        run: |
          # Initialize variables with inputs
          PRESET="${{ github.event.inputs.preset }}"
          
          # Default values (can be overridden by preset)
          RUN_NAME="${{ github.event.inputs.run_name }}"
          ENGINE="${{ github.event.inputs.engine }}"
          TEMPLATE_PATH="${{ github.event.inputs.template_path }}"
          ROOT_DIR="${{ github.event.inputs.root_dir }}"
          CNFFILE_NAME="${{ github.event.inputs.cnffile_name }}"
          SELECTED_CC="${{ github.event.inputs.selected_cc }}"
          SELECTED_CXX="${{ github.event.inputs.selected_cxx }}"
          CXXFLAGS="${{ github.event.inputs.cxxflags }}"
          
          # Apply Preset Logic
          if [[ "$PRESET" == "InnoDB-smblade04" ]]; then
            [ -z "$RUN_NAME" ] && RUN_NAME="node04-innodb"
            [ -z "$ENGINE" ] && ENGINE="innodb"
            [ -z "$TEMPLATE_PATH" ] && TEMPLATE_PATH="/mnt/data/template_datadir"
            [ -z "$ROOT_DIR" ] && ROOT_DIR="/mnt/fast/bench-mysql"
            [ -z "$CNFFILE_NAME" ] && CNFFILE_NAME="cnf/stable8x-noACID.cnf"
            [ -z "$SELECTED_CC" ] && SELECTED_CC="gcc-13"
            [ -z "$SELECTED_CXX" ] && SELECTED_CXX="g++-13"
            [ -z "$CXXFLAGS" ] && CXXFLAGS="-march=westmere"
          elif [[ "$PRESET" == "InnoDB-epyc9654" ]]; then
            [ -z "$RUN_NAME" ] && RUN_NAME="9654-innodb"
            [ -z "$ENGINE" ] && ENGINE="innodb"
            [ -z "$TEMPLATE_PATH" ] && TEMPLATE_PATH="/mnt/storage/template_datadir"
            [ -z "$ROOT_DIR" ] && ROOT_DIR="/mnt/scratch/bench-mysql"
            [ -z "$CNFFILE_NAME" ] && CNFFILE_NAME="cnf/stable8x-noACID.cnf"
            [ -z "$SELECTED_CC" ] && SELECTED_CC="gcc-14"
            [ -z "$SELECTED_CXX" ] && SELECTED_CXX="g++-14"
          elif [[ "$PRESET" == "RocksDB-smblade04" ]]; then
            [ -z "$RUN_NAME" ] && RUN_NAME="node04-myrocks"
            [ -z "$ENGINE" ] && ENGINE="rocksdb"
            [ -z "$TEMPLATE_PATH" ] && TEMPLATE_PATH="/mnt/data/template_datadir"
            [ -z "$ROOT_DIR" ] && ROOT_DIR="/mnt/fast/bench-mysql"
            [ -z "$CNFFILE_NAME" ] && CNFFILE_NAME="cnf/rocksdb-noACID.cnf"
            [ -z "$SELECTED_CC" ] && SELECTED_CC="gcc-13"
            [ -z "$SELECTED_CXX" ] && SELECTED_CXX="g++-13"
            [ -z "$CXXFLAGS" ] && CXXFLAGS="-march=westmere"
          elif [[ "$PRESET" == "RocksDB-epyc9654" ]]; then
            [ -z "$RUN_NAME" ] && RUN_NAME="9654-myrocks"
            [ -z "$ENGINE" ] && ENGINE="rocksdb"
            [ -z "$TEMPLATE_PATH" ] && TEMPLATE_PATH="/mnt/storage/template_datadir"
            [ -z "$ROOT_DIR" ] && ROOT_DIR="/mnt/scratch/bench-mysql"
            [ -z "$CNFFILE_NAME" ] && CNFFILE_NAME="cnf/rocksdb-noACID.cnf"
            [ -z "$SELECTED_CC" ] && SELECTED_CC="gcc-14"
            [ -z "$SELECTED_CXX" ] && SELECTED_CXX="g++-14"
          fi
          
          # Export to GITHUB_ENV
          echo "RUN_NAME=$RUN_NAME" >> $GITHUB_ENV
          echo "ENGINE=$ENGINE" >> $GITHUB_ENV
          echo "TEMPLATE_PATH=$TEMPLATE_PATH" >> $GITHUB_ENV
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          echo "CNFFILE_NAME=$CNFFILE_NAME" >> $GITHUB_ENV
          echo "SELECTED_CC=$SELECTED_CC" >> $GITHUB_ENV
          echo "SELECTED_CXX=$SELECTED_CXX" >> $GITHUB_ENV
          echo "CXXFLAGS=$CXXFLAGS" >> $GITHUB_ENV
          
          # Export other direct inputs
          echo "SERVER_REPO_URL=${{ github.event.inputs.server_repo_url }}" >> $GITHUB_ENV
          echo "SERVER_BRANCH=${{ github.event.inputs.server_branch }}" >> $GITHUB_ENV
          echo "WORKLOAD_NAMES=${{ github.event.inputs.workload_names }}" >> $GITHUB_ENV
          echo "MYEXTRA=${{ github.event.inputs.myextra }}" >> $GITHUB_ENV
          echo "RESULTS_EMAIL=${{ github.event.inputs.results_email }}" >> $GITHUB_ENV
          echo "THREADS_LIST=${{ github.event.inputs.threads_list }}" >> $GITHUB_ENV
          echo "WRITES_TIME_SECONDS=${{ github.event.inputs.writes_time_seconds }}" >> $GITHUB_ENV
          echo "NUM_TABLES=${{ github.event.inputs.num_tables }}" >> $GITHUB_ENV
          echo "DATASIZE=${{ github.event.inputs.datasize }}" >> $GITHUB_ENV
          echo "ENGINE_CACHE=${{ github.event.inputs.engine_cache }}" >> $GITHUB_ENV
          echo "SCALING_GOVERNOR=${{ github.event.inputs.scaling_governor }}" >> $GITHUB_ENV
          echo "REPEAT_NUM=${{ github.event.inputs.repeat_num }}" >> $GITHUB_ENV
          echo "REBUILD_TEMPLATE=${{ github.event.inputs.rebuild_template }}" >> $GITHUB_ENV
          echo "DBBENCH_SSL=${{ github.event.inputs.dbbench_ssl }}" >> $GITHUB_ENV
          echo "DATA_DIR=${{ github.event.inputs.data_dir }}" >> $GITHUB_ENV
          # echo "SYSBENCH_HOST=${{ github.event.inputs.sysbench_host }}" >> $GITHUB_ENV

      - name: Run Benchmark
        run: |
          echo "User: $(whoami) USER=$USER"
          echo "Running with configuration:"
          echo "SERVER_REPO_URL=$SERVER_REPO_URL"
          echo "SERVER_BRANCH=$SERVER_BRANCH"
          echo "MYEXTRA=$MYEXTRA"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "WORKLOAD_NAMES=$WORKLOAD_NAMES"
          echo "CNFFILE_NAME=$CNFFILE_NAME"
          echo "RESULTS_EMAIL=$RESULTS_EMAIL"
          echo "THREADS_LIST=$THREADS_LIST"
          echo "WRITES_TIME_SECONDS=$WRITES_TIME_SECONDS"
          echo "NUM_TABLES=$NUM_TABLES"
          echo "DATASIZE=$DATASIZE"
          echo "ENGINE_CACHE=$ENGINE_CACHE"
          echo "SELECTED_CC=$SELECTED_CC"
          echo "SELECTED_CXX=$SELECTED_CXX"
          echo "SCALING_GOVERNOR=$SCALING_GOVERNOR"
          echo "REPEAT_NUM=$REPEAT_NUM"
          echo "REBUILD_TEMPLATE=$REBUILD_TEMPLATE"
          echo "RUN_NAME=$RUN_NAME"
          echo "DATA_DIR=$DATA_DIR"
          echo "ROOT_DIR=$ROOT_DIR"
          echo "DBBENCH_SSL=$DBBENCH_SSL"
          echo "TEMPLATE_PATH=$TEMPLATE_PATH"
          
          export BACKUP_DIR=$GITHUB_WORKSPACE
          # unset GITHUB_WORKSPACE # GHA might rely on this, better not unset it unless necessary for the script
          
          export CACHE_DIR=$ROOT_DIR/results_cache
          
          # Ensure ROOT_DIR exists and has correct permissions
          if [ ! -d "$ROOT_DIR" ]; then
            sudo mkdir -p "$ROOT_DIR"
            sudo chown "$USER:$USER" "$ROOT_DIR"
          fi
          
          cd "$ROOT_DIR"
          rm -f build-and-bench.sh
          wget https://raw.githubusercontent.com/Percona-QA/perf-tests/refs/heads/3.0/build-and-bench.sh
          chmod a+x build-and-bench.sh
          
          # Run the benchmark script
          nice --adjustment=-10 bash -xe ./build-and-bench.sh

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ env.RUN_NAME }}
          path: |
            ${{ env.ROOT_DIR }}/*.tar.gz
            ${{ env.ROOT_DIR }}/*.csv
            ${{ env.ROOT_DIR }}/*.html

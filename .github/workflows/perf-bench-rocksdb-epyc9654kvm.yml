name: Perf Bench RocksDB epyc9654-kvm

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: 'Run Name'
        type: string
        default: '9654kvm-rocksdb'
      server_repo_url:
        description: 'Server Repo URL'
        type: string
        default: 'https://github.com/percona/percona-server'
      server_branch:
        description: 'Server Branch'
        type: string
        default: 'release-8.4.7-7'
      workload_names:
        description: 'Workload Names'
        type: string
        default: 'prod_trx'
      cnffile_name:
        description: 'Config File Name'
        type: string
        default: 'cnf/rocksdb-ACID.cnf'
      myextra:
        description: 'Extra MySQL Params'
        type: string
        default: ''
      cxxflags:
        description: 'CXXFLAGS'
        type: string
        default: ''
      results_email:
        description: 'Results Email'
        type: string
        default: 'przemyslaw.skibinski@percona.com'
      threads_list:
        description: 'Threads List'
        type: string
        default: '8 16 32 64'
      writes_time_seconds:
        description: 'Writes Time Seconds'
        type: string
        default: '300'
      num_tables:
        description: 'Num Tables'
        type: string
        default: '32'
      datasize:
        description: 'Datasize'
        type: string
        default: '20M'
      engine_cache:
        description: 'Engine Cache'
        type: string
        default: '96G'
      engine:
        description: 'Engine'
        type: string
        default: 'rocksdb'
      selected_cc:
        description: 'Selected CC'
        type: string
        default: 'gcc-14'
      selected_cxx:
        description: 'Selected CXX'
        type: string
        default: 'g++-14'
      scaling_governor:
        description: 'Scaling Governor'
        type: string
        default: 'performance'
      repeat_num:
        description: 'Repeat Num'
        type: string
        default: '1'
      rebuild_template:
        description: 'Rebuild Template'
        type: choice
        options:
          - 'OFF'
          - 'ON'
      dbbench_ssl:
        description: 'DBBench SSL'
        type: choice
        options:
          - 'off'
          - 'on'
      root_dir:
        description: 'Root Dir'
        type: choice
        options:
          - '/work/bench-rocks'
      data_dir:
        description: 'Data Dir (e.g. /dev/shm)'
        type: choice
        options:
          - ''
          - '/dev/shm'
      sysbench_host:
        description: 'Sysbench Host'
        type: string
        default: ''
      template_path:
        description: 'Template Path'
        type: string
        default: '/data/template_datadir'

jobs:
  bench:
    runs-on: [self-hosted, Linux, X64, epyc9654-kvm]
    env:
      # Input parameters mapped to environment variables
      RUN_NAME: ${{ inputs.run_name }}
      SERVER_REPO_URL: ${{ inputs.server_repo_url }}
      SERVER_BRANCH: ${{ inputs.server_branch }}
      WORKLOAD_NAMES: ${{ inputs.workload_names }}
      CNFFILE_NAME: ${{ inputs.cnffile_name }}
      MYEXTRA: ${{ inputs.myextra }}
      CXXFLAGS: ${{ inputs.cxxflags }}
      RESULTS_EMAIL: ${{ inputs.results_email }}
      THREADS_LIST: ${{ inputs.threads_list }}
      WRITES_TIME_SECONDS: ${{ inputs.writes_time_seconds }}
      NUM_TABLES: ${{ inputs.num_tables }}
      DATASIZE: ${{ inputs.datasize }}
      ENGINE_CACHE: ${{ inputs.engine_cache }}
      ENGINE: ${{ inputs.engine }}
      SELECTED_CC: ${{ inputs.selected_cc }}
      SELECTED_CXX: ${{ inputs.selected_cxx }}
      SCALING_GOVERNOR: ${{ inputs.scaling_governor }}
      REPEAT_NUM: ${{ inputs.repeat_num }}
      REBUILD_TEMPLATE: ${{ inputs.rebuild_template }}
      DBBENCH_SSL: ${{ inputs.dbbench_ssl }}
      ROOT_DIR: ${{ inputs.root_dir }}
      DATA_DIR: ${{ inputs.data_dir }}
      SYSBENCH_HOST: ${{ inputs.sysbench_host }}
      TEMPLATE_PATH: ${{ inputs.template_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Benchmark
        run: |
          echo "User: $(whoami) USER=$USER"
          echo "Running with configuration:"
          env
          
          export BACKUP_DIR=$GITHUB_WORKSPACE
          export CACHE_DIR=$ROOT_DIR/results_cache
          
          # Ensure ROOT_DIR exists and has correct permissions
          if [ ! -d "$ROOT_DIR" ]; then
            sudo mkdir -p "$ROOT_DIR"
            sudo chown "$USER:$USER" "$ROOT_DIR"
          fi
          
          cd "$ROOT_DIR"
          rm -f build-and-bench.sh
          wget https://raw.githubusercontent.com/Percona-QA/perf-tests/refs/heads/3.0/build-and-bench.sh
          chmod a+x build-and-bench.sh
          
          # Run the benchmark script
          nice --adjustment=-10 bash -xe ./build-and-bench.sh

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ env.RUN_NAME }}
          path: |
            ${{ env.ROOT_DIR }}/*.tar.gz
            ${{ env.ROOT_DIR }}/*.csv
            ${{ env.ROOT_DIR }}/*.html
